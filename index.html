<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recorder Consultație | Dentiq</title>
  <style>
    /* Păstrează tot stilul tău vechi aici – copiază-l din vechiul index.html dacă e modificat */
    /* ... (adaugă CSS-ul tău complet aici) ... */
  </style>
</head>
<body>
  <div class="container">
    <h2>Recorder Consultație Medicală</h2>
    <div id="timer">00:00</div>
    <button id="start" class="record-button" title="Începe înregistrare">🎤</button>
    <button id="stop" class="record-button" title="Oprește înregistrare">⏹</button>
    <div class="recording-indicator">● Înregistrare în desfășurare...</div>
    <audio id="preview" controls></audio>
    <div class="info">
      Fișierul audio și PDF-ul cu rezumat se descarcă automat la oprire.<br>
      La prima utilizare, permite accesul la microfon.
    </div>
    <div id="status" style="margin-top: 10px; color: blue;"></div>
  </div>

  <script>
    let recorder, audioBlob, startTime, timerInterval;

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(elapsed / 60)).padStart(2, "0");
      const secs = String(elapsed % 60).padStart(2, "0");
      document.getElementById("timer").textContent = `${mins}:${secs}`;
    }

    navigator.mediaDevices.getUserMedia({audio: true})
      .then(stream => {
        recorder = new MediaRecorder(stream);
        let chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          audioBlob = new Blob(chunks, {type: "audio/webm"});
          const audioUrl = URL.createObjectURL(audioBlob);
          document.getElementById("preview").src = audioUrl;

          // Descărcare audio
          const downloadAudio = document.createElement("a");
          downloadAudio.href = audioUrl;
          const today = new Date().toISOString().slice(0,10);
          downloadAudio.download = `consultatie_${today}.webm`;
          document.body.appendChild(downloadAudio);
          downloadAudio.click();
          document.body.removeChild(downloadAudio);

          // Procesare AI și PDF
          document.getElementById("status").textContent = "Procesare AI...";
          try {
            const response = await fetch('/api/transcribe', {
              method: 'POST',
              body: audioBlob,
            });
            if (response.ok) {
              const pdfBlob = await response.blob();
              const pdfUrl = URL.createObjectURL(pdfBlob);
              const downloadPdf = document.createElement("a");
              downloadPdf.href = pdfUrl;
              downloadPdf.download = `rezumat_consultatie_${today}.pdf`;
              document.body.appendChild(downloadPdf);
              downloadPdf.click();
              document.body.removeChild(downloadPdf);
              document.getElementById("status").textContent = "Succes! PDF descărcat.";
            } else {
              throw new Error('Eroare API');
            }
          } catch (err) {
            document.getElementById("status").textContent = "Eroare AI – descarcă doar audio.";
            console.error(err);
          }

          // Reset UI
          clearInterval(timerInterval);
          document.body.classList.remove("recording");
          document.getElementById("timer").textContent = "00:00";
        };
      })
      .catch(err => {
        alert("Eroare: Nu s-a putut accesa microfonul. Verifică permisiunile în browser.");
        console.error(err);
      });

    document.getElementById("start").onclick = () => {
      recorder.start();
      document.body.classList.add("recording");
      startTime = Date.now();
      timerInterval = setInterval(updateTimer, 1000);
      updateTimer();
    };

    document.getElementById("stop").onclick = () => {
      recorder.stop();
    };
  </script>
</body>
</html>
