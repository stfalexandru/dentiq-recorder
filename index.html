<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistentul tău Dentiq</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
    body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; }
    .container { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 40px; text-align: center; max-width: 400px; width: 90%; }
    h2 { margin-bottom: 30px; color: #4a5568; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 24px; background: #48bb78; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #38a169; }
    #error { color: #f56565; margin-top: 10px; }
    #app { display: none; } /* Recorder-ul ascuns până la login */
    /* Păstrează tot stilul tău frumos pentru recorder aici (copiat din versiunea anterioară) */
    /* ... (tot CSS-ul tău pentru timer, butoane etc.) ... */
  </style>
</head>
<body>
  <div class="container" id="login-container">
    <h2>Bine ai venit la Asistentul DentIQ</h2>
    <p>Introdu datele de acces pentru a începe</p>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Parolă" required>
    <button id="login-btn">Intră</button>
    <p id="error"></p>
  </div>

  <!-- Aplicația recorder (ascunsă până la login) -->
  <div class="container" id="app">
    <!-- Tot codul tău recorder existent aici (h2, timer, butoane, script etc.) -->
    <!-- Copiază din versiunea ta actuală (cea cu .txt și buton refresh) tot ce e în <div class="container"> și <script> -->
  </div>

  <script>
    // Supabase config (proiectul tău)
    const supabaseUrl = 'https://rnfymbsucywjzsugaqiz.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZnltYnN1Y3l3anpzZ3VhcWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc2NDkwNTMsImV4cCI6MjA5MzIyNTA1M30.L2g3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3'; // Cheia publică anon (sigură)

    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    document.getElementById("login-btn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        document.getElementById("error").textContent = "Completează ambele câmpuri";
        return;
      }

      // Caută user-ul în tabela users
      const { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('email', email)
        .single();

      if (error || !data) {
        document.getElementById("error").textContent = "Email sau parolă incorectă";
        return;
      }

      // Verifică parola (temporar în clar – mai târziu criptăm)
      if (data.password_hash !== password) {
        document.getElementById("error").textContent = "Email sau parolă incorectă";
        return;
      }

      // Login reușit
      document.getElementById("login-container").style.display = "none";
      document.getElementById("app").style.display = "block";

      // Aici pune tot codul tău recorder existent (din versiunea cu .txt)
      // (timer, recorder, download audio + .txt, buton refresh etc.)
    };
  </script>
</body>
</html>
