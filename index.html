<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistentul tău Dentiq</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
    body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; }
    .container { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px 20px; text-align: center; max-width: 380px; width: 90%; max-height: 95vh; overflow-y: auto; }
    h2 { margin: 0 0 20px 0; font-size: 1.5rem; color: #4a5568; }
    #timer { font-size: 48px; font-weight: bold; margin: 20px 0; color: #2d3748; }
    .record-button { width: 110px; height: 110px; border-radius: 50%; border: none; font-size: 48px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin: 15px auto; }
    #start { background: #48bb78; color: white; }
    #start:hover { background: #38a169; transform: scale(1.05); }
    #stop { background: #f56565; color: white; display: none; }
    #stop:hover { background: #e53e3e; transform: scale(1.05); }
    .recording #stop { display: block; animation: pulse 1.5s infinite; }
    .recording #start { display: none; }
    .recording-indicator { font-size: 20px; color: #f56565; margin: 15px 0; display: none; }
    .recording .recording-indicator { display: block; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 101, 101, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(245, 101, 101, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 101, 101, 0); } }
    #preview { margin-top: 20px; width: 100%; }
    #status { margin-top: 15px; font-size: 15px; font-weight: bold; min-height: 24px; }
    #result { margin-top: 20px; text-align: left; }
    #result h3 { margin: 15px 0 10px 0; color: #48bb78; }
    #result p { white-space: pre-wrap; background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 0 0 20px 0; }
    #result p.summary { background: #e6f4ea; font-weight: 500; }
    .info { margin-top: 20px; font-size: 14px; color: #718096; line-height: 1.6; }
    #new-recording-btn { margin-top: 20px; padding: 12px 24px; background: #3182ce; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; display: none; }
    #new-recording-btn:hover { background: #2b6cb0; }
    #login-container input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    #login-container button { padding: 12px 24px; background: #48bb78; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    #login-container button:hover { background: #38a169; }
    #error { color: #f56565; margin-top: 10px; }
  </style>
</head>
<body>
  <!-- Pagina de login -->
  <div class="container" id="login-container">
    <h2>Bine ai venit la Asistentul DentIQ</h2>
    <p>Introdu datele de acces furnizate de DentIQ</p>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Parolă" required>
    <button id="login-btn">Intră în asistent</button>
    <p id="error"></p>
  </div>

  <!-- Aplicația recorder (ascunsă până la login) -->
  <div class="container" id="app" style="display: none;">
    <h2>Asistentul tău Dentiq</h2>
    <div id="timer">00:00</div>
    <button id="start" class="record-button">🎤</button>
    <button id="stop" class="record-button">⏹</button>
    <div class="recording-indicator">● Înregistrare în desfășurare...</div>
    <audio id="preview" controls></audio>
    <div id="status"></div>
    <div id="result"></div>
    <button id="new-recording-btn">Înregistrare nouă</button>
    <div class="info">
      La oprire se descarcă automat audio + fișier text (.txt).<br>
      Textul apare mai jos pentru verificare.<br><br>
      <strong>Confidențialitate:</strong> Nimic nu este salvat pe server.
    </div>
  </div>

  <script>
    // Supabase config
    const supabase = supabase.createClient(
      'https://rnfymbsucywjzsugaqiz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZnltYnN1Y3l3anpzZ3VhcWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc2NDkwNTMsImV4cCI6MjA5MzIyNTA1M30.L2g3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3'
    );

    // Login
    document.getElementById("login-btn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        document.getElementById("error").textContent = "Completează ambele câmpuri";
        return;
      }

      const { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('email', email)
        .single();

      if (error || !data) {
        document.getElementById("error").textContent = "Email sau parolă incorectă";
        return;
      }

      // Verificare parolă temporară în clar (vom cripta mai târziu)
      if (data.password_hash !== password) {
        document.getElementById("error").textContent = "Email sau parolă incorectă";
        return;
      }

      // Login reușit – arată aplicația
      document.getElementById("login-container").style.display = "none";
      document.getElementById("app").style.display = "block";

      // Inițializează recorder-ul (codul tău existent)
      let recorder, audioBlob, startTime, timerInterval;

      const updateTimer = () => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, "0");
        const secs = String(elapsed % 60).padStart(2, "0");
        document.getElementById("timer").textContent = `${mins}:${secs}`;
      };

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          recorder = new MediaRecorder(stream);
          const chunks = [];

          recorder.ondataavailable = e => chunks.push(e.data);

          recorder.onstop = async () => {
            audioBlob = new Blob(chunks, { type: "audio/webm" });
            const audioUrl = URL.createObjectURL(audioBlob);
            document.getElementById("preview").src = audioUrl;

            // Download audio
            const today = new Date().toISOString().slice(0, 10);
            const a = document.createElement("a");
            a.href = audioUrl;
            a.download = `consultatie_${today}.webm`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Procesare AI
            document.getElementById("status").textContent = "Se procesează cu AI...";
            document.getElementById("status").style.color = "#3182ce";

            try {
              const response = await fetch("/api/transcribe", { method: "POST", body: audioBlob });

              if (!response.ok) throw new Error("Eroare server");

              const { fullText, summary } = await response.json();

              document.getElementById("result").innerHTML = `
                <h3>Transcriere completă:</h3>
                <p>${fullText || "Fără text"}</p>
                <h3>Rezumat structurat:</h3>
                <p class="summary">${summary || "Fără rezumat"}</p>
              `;

              // Salvează .txt
              const reclama = `\n\n\nȘtiai că?\n\nLaboratorul nostru de tehnică dentară DentIQ este specializat în lucrări All-on-X și oferă GARANȚIE PE VIAȚĂ pentru implanturi și proteze.\n\nSună-ne pentru o discuție amicală și o ofertă personalizată:\nTelefon: [număr]\nEmail: contact@dentiq.ro\nwww.dentiq.ro`;

              const txtContent = `TRANSCEIERE COMPLETĂ:\n\n${fullText}\n\nREZUMAT STRUCTURAT:\n\n${summary}${reclama}`;
              const txtBlob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
              const txtUrl = URL.createObjectURL(txtBlob);
              const txtLink = document.createElement("a");
              txtLink.href = txtUrl;
              txtLink.download = `rezumat_consultatie_${today}.txt`;
              document.body.appendChild(txtLink);
              txtLink.click();
              document.body.removeChild(txtLink);

              document.getElementById("status").textContent = "Gata! Audio + text salvate.";
              document.getElementById("status").style.color = "#48bb78";
            } catch (err) {
              document.getElementById("result").innerHTML = `<p style="color:#f56565;">Eroare AI: Încearcă din nou.</p>`;
              document.getElementById("status").textContent = "Doar audio salvat";
              document.getElementById("status").style.color = "#f56565";
            }

            document.getElementById("new-recording-btn").style.display = "block";

            clearInterval(timerInterval);
            document.body.classList.remove("recording");
          };
        })
        .catch(() => alert("Permite accesul la microfon."));

      document.getElementById("start").onclick = () => {
        recorder.start();
        document.body.classList.add("recording");
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
        document.getElementById("status").textContent = "";
        document.getElementById("result").innerHTML = "";
        document.getElementById("new-recording-btn").style.display = "none";
      };

      document.getElementById("stop").onclick = () => recorder.stop();

      document.getElementById("new-recording-btn").onclick = () => location.reload();
    };
  </script>
</body>
</html>
