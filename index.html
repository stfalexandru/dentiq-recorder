<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Login DentIQ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #48bb78; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #38a169; }
    #message { margin-top: 20px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Test Login DentIQ</h2>
    <input type="email" id="email" placeholder="Email" value="contact@dentiq.ro">
    <input type="password" id="password" placeholder="Parolă" value="1234">
    <button id="login-btn">Verifică login</button>
    <div id="message"></div>
  </div>

  <script>
    const supabase = supabase.createClient(
      'https://rnfymbsucywjzsugaqiz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZnltYnN1Y3l3anpzZ3VhcWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc2NDkwNTMsImV4cCI6MjA5MzIyNTA1M30.L2g3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3z3'
    );

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const messageEl = document.getElementById('message');
      messageEl.textContent = 'Se verifică...';
      messageEl.className = '';

      const { data, error } = await supabase
        .from('users')
        .select('email, password_hash')
        .eq('email', email)
        .single();

      if (error) {
        console.log("Eroare Supabase:", error);
        messageEl.textContent = 'Eroare conexiune sau email inexistent';
        messageEl.className = 'error';
        return;
      }

      if (data.password_hash === password) {
        messageEl.textContent = 'Login reușit! 🎉';
        messageEl.className = 'success';
      } else {
        messageEl.textContent = 'Parolă incorectă';
        messageEl.className = 'error';
      }
    });
  </script>
</body>
</html>
