<script>
  let recorder, audioBlob, startTime, timerInterval;

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const secs = String(elapsed % 60).padStart(2, "0");
    document.getElementById("timer").textContent = `${mins}:${secs}`;
  }

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      recorder = new MediaRecorder(stream);
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);

      recorder.onstop = async () => {
        audioBlob = new Blob(chunks, { type: "audio/webm" });
        const audioUrl = URL.createObjectURL(audioBlob);
        document.getElementById("preview").src = audioUrl;

        // Descărcare audio
        const today = new Date().toISOString().slice(0, 10);
        const audioLink = document.createElement("a");
        audioLink.href = audioUrl;
        audioLink.download = `consultatie_${today}.webm`;
        document.body.appendChild(audioLink);
        audioLink.click();
        document.body.removeChild(audioLink);

        // Procesare AI
        document.getElementById("status").textContent = "Se procesează cu AI... (5-20 sec)";
        document.getElementById("status").style.color = "#3182ce";

        try {
          const response = await fetch("/api/transcribe", {
            method: "POST",
            body: audioBlob,
          });

          const result = await response.json();

          if (response.ok) {
            // Arată textul în căsuță
            document.getElementById("result").innerHTML = `
              <h3 style="color:#48bb78; margin-top:20px;">Transcriere completă:</h3>
              <p style="white-space: pre-wrap; background:#f8f9fa; padding:15px; border-radius:10px;">${result.fullText || 'Fără text'}</p>
              
              <h3 style="color:#48bb78;">Rezumat structurat:</h3>
              <p style="white-space: pre-wrap; background:#e6f4ea; padding:15px; border-radius:10px; font-weight:500;">${result.summary || 'Fără rezumat'}</p>
            `;
            document.getElementById("status").textContent = "Succes! Textul este gata.";
            document.getElementById("status").style.color = "#48bb78";
          } else {
            throw new Error(result.error || 'Eroare server');
          }
        } catch (err) {
          document.getElementById("result").innerHTML = `<p style="color:#f56565;">Eroare AI: ${err.message}</p>`;
          document.getElementById("status").textContent = "Eroare – doar audio salvat.";
          document.getElementById("status").style.color = "#f56565";
        }

        // Reset
        clearInterval(timerInterval);
        document.body.classList.remove("recording");
        document.getElementById("timer").textContent = "00:00";
      };
    })
    .catch(err => {
      alert("Permite accesul la microfon pentru a folosi asistentul.");
    });

  document.getElementById("start").onclick = () => {
    recorder.start();
    document.body.classList.add("recording");
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
    document.getElementById("status").textContent = "";
    document.getElementById("result").innerHTML = "";
  };

  document.getElementById("stop").onclick = () => {
    recorder.stop();
  };
</script>
