<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistentul tău Dentiq</title>
  <style>
    /* Păstrează tot stilul tău frumos anterior - copiat exact */
    /* ... (tot CSS-ul tău de mai sus) ... */
  </style>
</head>
<body>
  <div class="container">
    <h2>Asistentul tău Dentiq</h2>
    <div id="timer">00:00</div>
    <button id="start" class="record-button">🎤</button>
    <button id="stop" class="record-button">⏹</button>
    <div class="recording-indicator">● Înregistrare în desfășurare...</div>
    <audio id="preview" controls></audio>
    <div id="status"></div>
    <div id="result"></div>
    <button id="new-recording-btn">Înregistrare nouă</button>
    <div class="info">
      La oprire se descarcă automat audio + PDF.<br>
      Textul apare mai jos pentru verificare.
    </div>
  </div>

  <script>
    // Codul tău recorder existent + procesare AI

    recorder.onstop = async () => {
      // ... (tot codul tău existent pentru audio download și procesare AI)

      try {
        const response = await fetch("/api/transcribe", { method: "POST", body: audioBlob });

        if (response.ok) {
          // Descarcă PDF-ul
          const pdfBlob = await response.blob();
          const pdfUrl = URL.createObjectURL(pdfBlob);
          const pdfLink = document.createElement("a");
          pdfLink.href = pdfUrl;
          const today = new Date().toISOString().slice(0,10);
          pdfLink.download = `rezumat_consultatie_${today}.pdf`;
          document.body.appendChild(pdfLink);
          pdfLink.click();
          document.body.removeChild(pdfLink);

          // Pentru căsuță, facem un call separat sau păstrăm JSON dacă vrei
          // Deocamdată, căsuța rămâne din versiunea anterioară dacă vrei

          document.getElementById("status").textContent = "Gata! Audio + PDF descărcate";
        } else {
          throw new Error("Eroare server");
        }
      } catch (err) {
        document.getElementById("status").textContent = "Eroare PDF – doar audio salvat";
      }

      // ... (restul codului tău)
    };
  </script>
</body>
</html>
