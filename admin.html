<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin DentIQ - Dashboard privat</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f9; padding: 40px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h2 { color: #4a5568; text-align: center; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #48bb78; color: white; }
    .info { margin-top: 40px; font-size: 15px; color: #718096; line-height: 1.6; background: #e6f4ea; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Admin DentIQ - Dashboard privat</h2>

    <h3>Statistici utilizare (logări + înregistrări)</h3>
    <table id="stats-table">
      <thead>
        <tr>
          <th>Data/ora</th>
          <th>Utilizator</th>
          <th>Acțiune</th>
          <th>Durată (sec)</th>
        </tr>
      </thead>
      <tbody>
        <!-- Se completează cu JS -->
      </tbody>
    </table>

    <div class="info">
      <p><strong>Instrucțiuni:</strong></p>
      <p>Pentru a adăuga un medic nou, spune-mi numele + parola dorită → îți dau linia de cod să o pui în index.html.</p>
      <p>Link aplicație medici: <a href="https://record.dentiq.ro" target="_blank">record.dentiq.ro</a></p>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const response = await fetch('/api/get-stats');
        if (!response.ok) throw new Error();
        const stats = await response.json();

        const tbody = document.querySelector("#stats-table tbody");
        tbody.innerHTML = "";
        stats.reverse().forEach(entry => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${entry.timestamp.slice(0,19).replace('T', ' ')}</td>
            <td>${entry.user}</td>
            <td>${entry.type === 'login' ? 'Login' : 'Înregistrare'}</td>
            <td>${entry.duration || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.querySelector("#stats-table tbody").innerHTML = "<tr><td colspan='4'>Încă nu sunt statistici</td></tr>";
      }
    }

    loadStats();
  </script>
</body>
</html>
